name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run tests
        run: go test -race ./...

      - name: TUI PTY smoke
        run: |
          go build -o lazywrap-test ./cmd/lazywrap
          python3 scripts/tui_smoke.py

      - name: Go formatting diff
        run: gofmt -d cmd/lazywrap/main.go cmd/lazywrap/help_test.go internal/supervisor/service.go internal/supervisor/inspection*.go internal/process/tracker*.go internal/observe internal/tui

      - name: Run vet
        run: go vet ./...

  goreleaser-snapshot:
    name: Build GoReleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

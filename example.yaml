port: 3000
# Split app definitions into other local YAML files when useful:
# resources:
#   - apps/backend.yaml
idle: 30m
logLevel: info
startTimeout: 30s
stopTimeout: 10s

startUp:
  - docker compose up -d shared-dependency
tearDown:
  - docker compose down

apps:
  api:
    pwd: /path/to/api
    build: go build ./...
    launch: ./api
    env:
      APP_ENV: development
      LOG_LEVEL: debug
    path: /service/api
    port: 1980
    idle: 5m
    includePrefix: false

  docs:
    pwd: /path/to/docs
    launch: npm run dev
    # Defaults to docs.localhost because neither host nor path is set.
    port: 1988
    idle: 5m

  greeter:
    pwd: /path/to/greeter
    launch: go run ./cmd/server
    protocol: grpc
    host: greeter.localhost
    port: 50051
    idle: 5m
    health:
      grpc: true

  postgres:
    pwd: /path/to/project
    launch: docker compose up postgres
    stop: docker compose stop postgres
    protocol: tcp
    listenPort: 15432
    port: 5432
    idle: 30m

  kafka:
    pwd: /path/to/kafka
    launch: bin/kafka-server-start.sh config/server.properties
    protocol: tcp
    listenPort: 19092
    port: 9092
    idle: 0

port: 3000
idle: 30m
logLevel: info
startTimeout: 30s
stopTimeout: 10s

apps:
  api:
    pwd: /path/to/api
    build: go build ./...
    launch: ./api
    path: /service/api
    port: 1980
    idle: 5m
    includePrefix: false

  docs:
    pwd: /path/to/docs
    launch: npm run dev
    # Defaults to docs.localhost because neither host nor path is set.
    port: 1988
    idle: 5m

  postgres:
    pwd: /path/to/project
    launch: docker compose up postgres
    stop: docker compose stop postgres
    protocol: tcp
    listenPort: 15432
    port: 5432
    idle: 30m

  kafka:
    pwd: /path/to/kafka
    launch: bin/kafka-server-start.sh config/server.properties
    protocol: tcp
    listenPort: 19092
    port: 9092
    idle: 0

port: 3000
idle: 30m
logLevel: info
startTimeout: 30s
stopTimeout: 10s

apps:
  api:
    pwd: /path/to/api
    build: go build ./...
    launch: ./api
    path: /service/api
    port: 1980
    idle: 5m
    includePrefix: false

  docs:
    pwd: /path/to/docs
    launch: npm run dev
    host: docs.localhost
    port: 1988
    idle: 5m
